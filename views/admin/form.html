{% extends "base.html" %}

{% block content %}
<h1>{{ title }}</h1>

<form method="POST" action="{{ formAction }}">
    <label for="title">Title</label>
    <input
            id="title"
            name="title"
            type="text"
            value="{{ trail.title }}"
            required
    />

    <label for="description">Description</label>
    <textarea id="description" name="description" rows="6" required>{{ trail.description }}</textarea>

    <label for="difficulty">Difficulty</label>
    <select id="difficulty" name="difficulty" required>
        <option value="easy" {% if trail.difficulty == "easy" %}selected{% endif %}>Easy</option>
        <option value="moderate" {% if trail.difficulty == "moderate" %}selected{% endif %}>Moderate</option>
        <option value="hard" {% if trail.difficulty == "hard" %}selected{% endif %}>Hard</option>
    </select>

    <label for="distance_km">Distance in km</label>
    <input
            id="distance_km"
            name="distance_km"
            type="number"
            step="0.1"
            min="0"
            value="{{ trail.distance_km }}"
            required
    />

    <label for="region_id">Region</label>
    <select id="region_id" name="region_id" required>
        {% for region in regions %}
        <option
                value="{{ region.id }}"
                {% if trail.region_id == region.id %}selected{% endif %}
        >
            {{ region.name }} — {{ region.country }}
        </option>
        {% endfor %}
    </select>

    <button type="submit">{{ submitLabel }}</button>
    <a href="/admin">Cancel</a>
</form>
{% endblock content %}
